# .github/workflows/scrape_jobs.yml
name: Daily Job Scraper

on:
  schedule:
    # Runs every hour from 9am to 8pm UTC (5pm to 4am SGT next day)
    - cron: "0 8-19 * * *"
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest # Use a standard Linux runner

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4 # Checks out your code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Specify your desired Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # OpenAI API Key
        run: python scraper.py # Execute your script

      - name: Trigger job scorer workflow
        run: |
          gh workflow run score_jobs.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
