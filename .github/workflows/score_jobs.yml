# .github/workflows/score_jobs.yml
name: Hourly Job Scorer

on:
  workflow_call: # Allows this to be triggered by other workflows
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  score:
    runs-on: ubuntu-latest # Use a standard Linux runner

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4 # Checks out your code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Specify your desired Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run job scoring script
        env:
          # Define environment variables needed by score_jobs.py
          # These should be set as Secrets in your GitHub repository settings
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
        run: python score_jobs.py # Execute the job scoring script

      - name: Create job alert issue
        if: hashFiles('job_alerts.md') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the label if it doesn't exist yet
          gh label create "job-alert" --color "0075ca" --description "Automated job score alert" 2>/dev/null || true
          TITLE="🎯 New Job Matches Found — $(date +'%b %d, %Y %H:%M UTC')"
          gh issue create \
            --title "$TITLE" \
            --body-file job_alerts.md \
            --label "job-alert" \
            --assignee "${{ github.repository_owner }}"
